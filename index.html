<!DOCTYPE html>
<style>
body{background:#be9164; margin-top:15vh; text-align:center; }
.score:hover{transform: scale(1.1); box-shadow: 5px 5px rgba(0, 0, 0, 0.269);}</style>
<h1 style="font-family:monospace; -webkit-text-stroke: 1.5px #5e2605; color:#b35a26; font-size:40px;">Cookie Clicker</h1>
<br>
<button style="border:none; background: rgba(255, 0, 0, 0);">
    <canvas id="cookie" width="200" height="200">Cookie</canvas>
</button>
<center>
    <div class="score" style="background-color: #ab792a; width: 150px; height: 40px; border-radius: 4px;">
<p style="font-family: cursive; font-size: 25px; color: white;">Score: <span id="score">0</span></p>
</div>
</center>
<script>
    const canvas = document.getElementById("cookie");
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = '#d2b48c';
    ctx.beginPath();
    ctx.arc(100, 100, 80, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#4b3621';
    ctx.beginPath();
    ctx.arc(70,80, 10, 0, Math.PI * 2);
    ctx.arc(130, 120, 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#4b3621';
    ctx.beginPath();
    ctx.arc(100, 100, 6, 0, Math.PI * 2);
    ctx.arc(70, 140, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#4b3621';
    ctx.beginPath();
    ctx.arc(110, 140, 9, 0, Math.PI * 2);
    ctx.arc(130, 70, 11, 0, Math.PI * 2);
    ctx.fill();
</script>
